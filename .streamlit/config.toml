# Streamlit server settings for PlacementIQ.

[server]
# Resumes over 5 MB are rejected by piq/resume.py anyway; refuse them before they reach memory.
maxUploadSize = 5
# Serves static/ (self-hosted fonts, brand mark) at app/static/: the app works offline in a
# college lab and never calls a font CDN.
enableStaticServing = true

[browser]
# The app handles student resumes: send no usage telemetry.
gatherUsageStats = false

# Design tokens. piq/config.py holds the same colours (PALETTE, SEMANTIC_COLORS, TOPIC_COLORS);
# tests/test_theme.py checks contrast and that both agree. Rationale: docs/design/DESIGN.md.
[theme]
# Atkinson Hyperlegible Next was designed to stay unambiguous for low-vision readers: it holds
# up on a projector and for anxious students. Bricolage Grotesque gives headings a voice;
# JetBrains Mono is only for USNs and commands.
font = "Atkinson Hyperlegible Next, sans-serif"
headingFont = "Bricolage Grotesque, sans-serif"
codeFont = "JetBrains Mono, monospace"
baseFontSize = 16
# Type scale (px): 36 / 24 / 18 headings, 16 body, 14 small; key numbers 36.
headingFontSizes = ["2.25rem", "1.5rem", "1.125rem", "1rem", "0.875rem", "0.875rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
codeFontSize = "0.875rem"
metricValueFontSize = "2.25rem"
metricValueFontWeight = 700
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
# Inputs need a >= 3:1 edge to be found; their fill alone is too faint.
showWidgetBorder = true
# The sidebar's own background already separates it.
showSidebarBorder = false

# Self-hosted OFL fonts, Latin subset (licences next to each file). Variable files: one file
# covers both weights of a family.
[[theme.fontFaces]]
family = "Atkinson Hyperlegible Next"
url = "app/static/fonts/atkinson-hyperlegible-next/AtkinsonHyperlegibleNext-latin.woff2"
weight = "400 700"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Bricolage Grotesque"
url = "app/static/fonts/bricolage-grotesque/BricolageGrotesque-latin.woff2"
weight = "600 700"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/fonts/jetbrains-mono/JetBrainsMono-latin.woff2"
weight = "400"
style = "normal"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[theme.light]
primaryColor = "#0D6670"
backgroundColor = "#FBFBFA"
secondaryBackgroundColor = "#F0F2F0"
textColor = "#1A2326"
linkColor = "#0D6670"
borderColor = "#7A8582"
# Code (commands, model answers) stays neutral; the default green would read as "success".
codeTextColor = "#1A2326"
codeBackgroundColor = "#F0F2F0"
dataframeBorderColor = "#DCE1DE"
dataframeHeaderBackgroundColor = "#F0F2F0"
dataframeHeaderTextColor = "#1A2326"
greenColor = "#1B6F36"
greenTextColor = "#1B6F36"
yellowColor = "#784E00"
yellowTextColor = "#784E00"
orangeColor = "#784E00"
orangeTextColor = "#784E00"
redColor = "#951B2C"
redTextColor = "#951B2C"
blueColor = "#0045D2"
blueTextColor = "#0045D2"
grayColor = "#566461"
grayTextColor = "#566461"
# TOPICS order: Aptitude, DBMS, OS, CN, DSA, OOP.
chartCategoricalColors = ["#C78100", "#005D9C", "#A55582", "#009B71", "#B23D00", "#3799CC"]
chartSequentialColors = ["#DCF4F5", "#C2E0E1", "#A8CCCD", "#8EB8BA", "#74A5A7", "#5B9295", "#407F82", "#226D71", "#005B5F", "#00494F"]

[theme.dark]
primaryColor = "#1F7F86"
backgroundColor = "#111A1C"
secondaryBackgroundColor = "#1A2528"
textColor = "#E3EAE8"
linkColor = "#6CCBC4"
borderColor = "#64716E"
codeTextColor = "#E3EAE8"
codeBackgroundColor = "#1A2528"
dataframeBorderColor = "#2C383B"
dataframeHeaderBackgroundColor = "#1A2528"
dataframeHeaderTextColor = "#E3EAE8"
greenColor = "#5BBF7A"
greenTextColor = "#5BBF7A"
yellowColor = "#F0D45C"
yellowTextColor = "#F0D45C"
orangeColor = "#F0D45C"
orangeTextColor = "#F0D45C"
redColor = "#FF8675"
redTextColor = "#FF8675"
blueColor = "#A9BCF5"
blueTextColor = "#A9BCF5"
grayColor = "#A0AEAB"
grayTextColor = "#A0AEAB"
chartCategoricalColors = ["#EFA71C", "#0975B6", "#DF8BB9", "#009B71", "#D05900", "#55B4E8"]
chartSequentialColors = ["#163332", "#234644", "#305957", "#3E6D6B", "#4C817F", "#5B9794", "#69ACA9", "#79C3BF", "#89D9D6", "#99F0EC"]

# The sidebar swaps the two background layers: it sits on the surface colour and its inputs
# on the page colour, so the sidebar reads as a separate panel without a border line.
[theme.light.sidebar]
backgroundColor = "#F0F2F0"
secondaryBackgroundColor = "#FBFBFA"
textColor = "#1A2326"
linkColor = "#0D6670"
borderColor = "#7A8582"
primaryColor = "#0D6670"

[theme.dark.sidebar]
backgroundColor = "#1A2528"
secondaryBackgroundColor = "#111A1C"
textColor = "#E3EAE8"
linkColor = "#6CCBC4"
borderColor = "#64716E"

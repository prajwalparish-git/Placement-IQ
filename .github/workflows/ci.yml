name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code; the token gets nothing else.
permissions:
  contents: read

# The test suite stays with the developers; the public repository proves the product: format,
# lint, every module compiles, the datasets agree, and every page renders in mock mode.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Compile, datasets and pages (offline, MOCK_MODE; no secrets needed)
        run: python -m scripts.ci_check
